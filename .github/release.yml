changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - someuser
  categories:
    - title: Breaking Changes 🛠
      labels:
        - breaking-change
    - title: Exciting New Features 🎉
      labels:
        - enhancement
    - title: Bug fix
      labels:
        - bugfix
    - title: Performance
      labels:
        - performance
    - title: Pipeline
      labels:
        - pipeline
    - title: Dependencies
      labels:
        - dependencies
    - title: Tests
      labels:
        - test
    - title: Other Changes
      labels:
        - "*"
